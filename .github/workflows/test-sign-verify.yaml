name: test-sign-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing via GitHub OIDC

    outputs:
      image: ghcr.io/elijah-ciroos/cosign-testing
      digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ghcr.io/elijah-ciroos/cosign-testing
          tags: type=sha,format=long

      - name: Build and push test image
        uses: docker/build-push-action@v6.18.0
        id: build-and-push
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

      - name: Sign the image with GitHub OIDC
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
          echo "images=${images}" >> "$GITHUB_ENV"

      - name: Verify the signature
        run: |
          cosign verify ${{ env.images }} \
            --certificate-identity="https://github.com/elijah-ciroos/cosign-testing/.github/workflows/test-sign-verify.yaml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Generate SBOM with Syft
        run: |
          image=$(echo "${{ env.images }}" | awk '{print $1}')
          syft "${image}" -o spdx-json="sbom.spdx.json"

      - name: Attest the SBOM with GitHub OIDC
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            cosign attest --yes \
              --predicate sbom.spdx.json \
              --type spdxjson \
              "${tag}@${DIGEST}"
          done

      - name: Verify the SBOM attestation
        run: |
          cosign verify-attestation ${{ env.images }} \
            --type spdxjson \
            --certificate-identity="https://github.com/elijah-ciroos/cosign-testing/.github/workflows/test-sign-verify.yaml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

  # Generates SLSA3 build provenance for the image using the official SLSA
  # generator. This runs as a separate reusable workflow (rather than a step
  # in build-sign-verify) because that trust-boundary separation is what lets
  # the provenance attest to how the image was actually built.
  provenance:
    needs: build-sign-verify
    permissions:
      actions: read # required to read the workflow run that produced the image
      id-token: write # required for keyless signing via GitHub OIDC
      packages: write # required to upload the attestation to ghcr.io
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-sign-verify.outputs.image }}
      digest: ${{ needs.build-sign-verify.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-provenance:
    needs: [build-sign-verify, provenance]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Verify the SLSA provenance attestation
        run: |
          slsa-verifier verify-image \
            "${{ needs.build-sign-verify.outputs.image }}@${{ needs.build-sign-verify.outputs.digest }}" \
            --source-uri github.com/elijah-ciroos/cosign-testing \
            --source-branch main
